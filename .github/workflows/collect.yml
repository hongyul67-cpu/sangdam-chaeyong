name: 상담·행정 공고 수집

on:
  schedule:
    # 일·수 23:50 UTC = 한국시간 월·목 아침 08:50 (3~4일에 한 번).
    # 9시 정각에 맞추지 않고 10분 일찍 건다 — 깃허브 예약은 매시 00분이
    # 가장 붐벼 수십 분 밀린다. 조금 앞서 걸어야 '9시에 열면 이미 새로고침돼 있다'가 된다.
    - cron: "50 23 * * 0,3"
  workflow_dispatch:        # 필요할 때 손으로 돌리는 버튼

permissions:
  contents: write           # 결과를 저장소에 되커밋하려면 필요

concurrency:
  group: sangdam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 깃허브 서버는 UTC 로 돈다. 이걸 켜야 화면의 '마지막 갱신'과
      # 날짜·로그가 한국시간으로 찍힌다. (없으면 아침 9시가 0시로 보인다)
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
          WORK_API_KEY: ${{ secrets.WORK_API_KEY }}
        run: python collect.py

      - name: 결과 되커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "수집 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 실행 요약
        if: always()
        run: tail -n 30 data/log.txt || echo "로그 없음"
